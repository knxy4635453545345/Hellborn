name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: clone imgui e dobby
        run: |
          mkdir -p third_party
          git clone --depth 1 https://github.com/ocornut/imgui third_party/imgui
          git clone --depth 1 https://github.com/jmpews/Dobby  third_party/Dobby

      - name: install ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: configure
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release

      - name: build
        run: cmake --build build -j$(nproc)

      - name: check
        run: |
          file build/libhellborn.so
          ls -lh build/libhellborn.so

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: libhellborn-arm64
          path: build/libhellborn.so
          retention-days: 30
