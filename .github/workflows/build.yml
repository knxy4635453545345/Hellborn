name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: organizar arquivos
        run: |
          echo "--- antes ---"
          ls -la
          if [ -f "cmakelist.txt" ]; then mv cmakelist.txt CMakeLists.txt; fi
          mkdir -p jni hooks menu include
          [ -f "hellborn.cpp" ] && mv hellborn.cpp jni/hellborn.cpp || true
          [ -f "Stealth.cpp" ] && mv Stealth.cpp jni/stealth.cpp || true
          [ -f "mira.cpp" ] && mv mira.cpp hooks/aimbot.cpp || true
          [ -f "visualizador.cpp" ] && mv visualizador.cpp hooks/esp.cpp || true
          [ -f "overlay.cpp" ] && mv overlay.cpp menu/overlay.cpp || true
          [ -f "hellborn.h" ] && mv hellborn.h include/hellborn.h || true
          echo "--- depois ---"
          ls -la
          find . -maxdepth 2 \( -name "*.cpp" -o -name "*.h" -o -name "CMakeLists.txt" \) -print

      - name: clone imgui e dobby
        run: |
          mkdir -p third_party
          git clone --depth 1 https://github.com/ocornut/imgui third_party/imgui
          git clone --depth 1 https://github.com/jmpews/Dobby  third_party/Dobby

      - name: install ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: configure
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release

      - name: compile check
        run: |
          for f in jni/hellborn.cpp jni/stealth.cpp hooks/esp.cpp hooks/aimbot.cpp menu/overlay.cpp; do
            echo "=== $f ==="
            $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++ \
              -std=c++20 -fsyntax-only -Iinclude -Ithird_party/imgui -Ithird_party/Dobby/include "$f" || true
          done

      - name: build
        run: |
          set -x
          cmake --build build --verbose -j$(nproc)

      - name: check
        run: |
          file build/libhellborn.so
          ls -lh build/libhellborn.so

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: libhellborn-arm64
          path: build/libhellborn.so
          retention-days: 30
