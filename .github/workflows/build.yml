name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: organizar arquivos
        run: |
          if [ -f "cmakelist.txt" ] && [ ! -f "CMakeLists.txt" ]; then mv cmakelist.txt CMakeLists.txt; fi
          mkdir -p jni hooks menu include
          [ -f "hellborn.cpp" ] && mv hellborn.cpp jni/hellborn.cpp || true
          [ -f "Stealth.cpp" ] && mv Stealth.cpp jni/stealth.cpp || true
          [ -f "mira.cpp" ] && mv mira.cpp hooks/aimbot.cpp || true
          [ -f "visualizador.cpp" ] && mv visualizador.cpp hooks/esp.cpp || true
          [ -f "overlay.cpp" ] && mv overlay.cpp menu/overlay.cpp || true
          [ -f "hellborn.h" ] && mv hellborn.h include/hellborn.h || true

      - name: clone imgui e dobby
        run: |
          mkdir -p third_party
          git clone --depth 1 https://github.com/ocornut/imgui third_party/imgui
          git clone --depth 1 https://github.com/jmpews/Dobby  third_party/Dobby

      - name: patch dobby asm
        run: |
          find third_party/Dobby -name "*.asm" -path "*arm64*" -print -exec sed -i -E 's/(, *)([^,[:space:]]+)@PAGEOFF/\1:lo12:\2/g; s/(, *)([^,[:space:]]+)@PAGE/\1:pg_hi21:\2/g' {} +
          echo "--- verificando patch ---"
          grep -rn "common_closure_bridge_handler" third_party/Dobby/source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.asm || true

      - name: install ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: configure
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure.log

      - name: build
        run: |
          set -o pipefail
          cmake --build build --verbose -j$(nproc) 2>&1 | tee build.log

      - name: upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            configure.log
          retention-days: 7

      - name: upload lib
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: libhellborn-arm64
          path: build/libhellborn.so
          retention-days: 30
